name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to use when running manually (e.g. v0.1.0-manual)'
        required: true
        default: 'manual-build'

jobs:
  release:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/shauryaps-08/chisel-ci:latest
    permissions:
      contents: write

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Copy in project template (Makefile, build.sc, scalafix/scalafmt configs)
        run: |
          cp /opt/chisel-ci-template/Makefile ./
          cp /opt/chisel-ci-template/build.sc ./
          cp /opt/chisel-ci-template/.scalafix.conf ./
          cp /opt/chisel-ci-template/.scalafmt.conf ./
          cp /opt/chisel-ci-template/.mill-version ./
          ln -s /opt/playground ../playground

      - name: Generate RTL
        env:
          JAVA_OPTS: "-Xmx4g -Xss8m"
        run: make rtl

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag_name=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=auto-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package RTL
        run: |
          if [ ! -d generated_sv_dir ] || [ -z "$(find generated_sv_dir -name '*.sv' -print -quit)" ]; then
            echo "No .sv files were generated — aborting release."
            exit 1
          fi
          tar -czvf generated-rtl-${{ steps.tag.outputs.tag_name }}.tar.gz generated_sv_dir/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: RTL Release ${{ steps.tag.outputs.tag_name }}
          files: generated-rtl-*.tar.gz
          generate_release_notes: true
